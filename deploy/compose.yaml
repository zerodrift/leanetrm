name: ${DEPLOYMENT_PROJECT:?}
services:
  database:
    image: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
    container_name: ${DATABASE_CONTAINER:?}
    restart: unless-stopped
    environment:
      POSTGRES_DB: openetrm
      POSTGRES_USER: openetrm_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/database-owner
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256 --data-checksums
      TZ: UTC
      PGTZ: UTC
    # The API's pools hold at most 46 connections (docs/ai-assistant.md §11), beside the collector and operator sessions.
    command: [postgres, -c, track_commit_timestamp=on, -c, timezone=UTC, -c, max_connections=80]
    volumes:
      - ${STATE_ROOT:?}/postgres:/var/lib/postgresql/data
      - ${PRIVATE_ROOT:?}/database-owner:/run/secrets/database-owner:ro
    networks: [database]
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: [CMD, pg_isready, -U, openetrm_owner, -d, openetrm]
      interval: 10s
      timeout: 5s
      retries: 6
  api:
    image: ${API_IMAGE:?}
    container_name: ${API_CONTAINER:?}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      OPENETRM_HOSTED_CONFIG: /run/private/host.json
    volumes:
      - ${PRIVATE_ROOT:?}/application:/run/private:ro
      - ${STATE_ROOT:?}/application:/var/lib/openetrm
    ports:
      - target: 8080
        published: "${GATEWAY_PORT:?}"
        host_ip: "${GATEWAY_ADDRESS:?}"
        protocol: tcp
    networks: [database, web_ingress]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
  collector:
    profiles: [collection]
    image: ${API_IMAGE:?}
    environment:
      OPENETRM_COLLECTION_CONFIG: /run/private/collection.json
    volumes:
      - ${PRIVATE_ROOT:?}/collection:/run/private:ro
    networks: [database, collection_egress]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
networks:
  collection_egress:
  database:
    internal: true
  web_ingress:
