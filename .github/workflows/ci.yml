name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Synthetic verification (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: ["workspace", "standard", "assistant", "trading", "portfolio", "settlement", "ppa", "recovery"]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Record the verification environment
        shell: bash
        run: |
          printf 'Runner image: %s (%s)\n' "$ImageOS" "$ImageVersion"
          dotnet --info
          node --version
          npm --version
          python3 --version
          /usr/lib/postgresql/16/bin/postgres --version
          google-chrome --version
          dpkg-query -W tzdata libicu74
      - name: Check release admission and archive boundaries
        run: python3 -m unittest discover -s tests -p test_release_deployment.py
      - name: Validate deployment configuration
        run: python3 tools/check_deployment.py
      - name: Run synthetic verification
        shell: bash
        run: |
          python3 tools/check_all.py --group "${{ matrix.group }}" \
            --pg-bin /usr/lib/postgresql/16/bin \
            --dotnet "$(command -v dotnet)" \
            --browser "$(command -v google-chrome)"

  checks:
    name: Stock database and browser checks
    needs: verification
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every verification group to complete successfully
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
        run: test "$VERIFICATION_RESULT" = success

  publish:
    name: Publish hosted release
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.RELEASE_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: hosted-release
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build release outputs
        run: |
          dotnet restore src/OpenEtrm.Api/OpenEtrm.Api.csproj --locked-mode
          dotnet publish src/OpenEtrm.Api/OpenEtrm.Api.csproj --no-restore --no-self-contained --configuration Release --output "$RUNNER_TEMP/api"
          dotnet restore src/OpenEtrm.Worker/OpenEtrm.Worker.csproj --locked-mode
          dotnet publish src/OpenEtrm.Worker/OpenEtrm.Worker.csproj --no-restore --no-self-contained --configuration Release --output "$RUNNER_TEMP/worker"
          npm ci --prefix web --ignore-scripts
          npm run build --prefix web
          mkdir "$RUNNER_TEMP/release"
          python3 tools/package_release.py --api "$RUNNER_TEMP/api" --worker "$RUNNER_TEMP/worker" --web web/dist \
            --output "$RUNNER_TEMP/release/openetrm-release.tar.gz" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Attest the complete release envelope
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release/openetrm-release.tar.gz
      - name: Publish the attested release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_FILE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          python3 tools/publish_release.py --directory "$RUNNER_TEMP/release" --attestation "$ATTESTATION_FILE"
